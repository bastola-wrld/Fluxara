# docker-compose.prod.yml
# Production. All secrets come from the environment. There are no defaults.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fluxara
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/fluxara
      FLUXARA_ENV: production
      FLUXARA_SECRET_KEY: ${FLUXARA_SECRET_KEY:?set FLUXARA_SECRET_KEY}
      FLUXARA_CORS_ORIGINS: ${FLUXARA_CORS_ORIGINS:?set FLUXARA_CORS_ORIGINS}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/fluxara
      FLUXARA_SECRET_KEY: ${FLUXARA_SECRET_KEY:?set FLUXARA_SECRET_KEY}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
    command: python -m fluxara.data.daily_fetch
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
