name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fluxara
          POSTGRES_PASSWORD: fluxara
          POSTGRES_DB: fluxara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fluxara" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fluxara:fluxara@localhost:5432/fluxara_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
